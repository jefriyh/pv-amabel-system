server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Foto KTP/selfie diunggah dari kamera HP — beri ruang lebih
    client_max_body_size 25M;

    # Aplikasi berjalan di belakang reverse proxy / Cloudflare.
    # Header ini diteruskan ke PHP; Laravel (TrustProxies) yang memutuskan mempercayainya.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120;
    }

    # Jangan pernah sajikan file tersembunyi (.env, .git, dst)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
