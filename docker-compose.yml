services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: guestbook-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # vendor/ berisi ~23 ribu file. Lewat bind mount Docker Desktop (Windows/macOS)
      # opcache butuh berdetik-detik hanya untuk memeriksa ulang seluruhnya, sehingga
      # setiap request jadi lambat. Ditaruh di named volume agar dibaca dari filesystem
      # container yang cepat. Konsekuensinya `composer install` harus dijalankan lewat
      # container (lihat README), bukan dari host.
      - vendor-data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PHP_IDE_CONFIG: "serverName=guestbook"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Hanya dibuka ke localhost host, tidak ke jaringan luar
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-guestbook}
      MYSQL_USER: ${DB_USERNAME:-guestbook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  queue:
    image: guestbook-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    # Notifikasi Telegram dikirim langsung saat submit, bukan lewat antrean.
    # Worker ini tetap diperlukan untuk export CSV/Excel di dashboard Filament.
    command: php artisan queue:work --tries=3 --backoff=10 --sleep=3 --max-time=3600
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  scheduler:
    image: guestbook-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  # Build aset frontend (Tailwind + JS form tamu).
  # Bukan bagian dari `docker compose up` biasa — jalankan manual saat aset berubah:
  #   docker compose run --rm node npm install
  #   docker compose run --rm node npm run build
  node:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"

volumes:
  mysql-data:
  vendor-data:
